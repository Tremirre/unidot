##### PREFIX #####
unbind C-b
set -g prefix C-a
bind C-a send-prefix

##### VI MODE #####
setw -g mode-keys vi
set -g status-keys vi

##### WINDOW/PANE NUMBERING (1-based, so Cmd+1 jumps to first window) #####
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

##### SPLITS (Vim-friendly, inherit cwd) #####
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

##### PANE NAVIGATION (like Vim splits) #####
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

##### RESIZE (Shift + hjkl) #####
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

##### EASY RELOAD #####
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

##### FAST ESCAPE #####
set -sg escape-time 0

##### BETTER COLORS (important for macOS + Linux) #####
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

##### MOUSE (optional but practical) #####
set -g mouse on

##### CMUX-LIKE SHORTCUTS #####
# Pair these with the cmd+key bindings in ~/.config/ghostty/config which
# translate cmd+<key> into "C-a <key>" so the same actions also work via the
# leader prefix. Most actions use stock tmux bindings (c, n, p, ,, z, 0-9);
# the overrides below tweak a few defaults to better match cmux behavior.

# Close pane / window immediately, no confirmation (matches cmux Cmd+W)
unbind x
bind x kill-pane
unbind \&
bind \& kill-window

# Open new windows in the current pane's working directory (matches cmux Cmd+T)
bind c new-window -c "#{pane_current_path}"

# Spawn and attach to a brand new tmux session (mapped to Cmd+Y in Ghostty)
bind S new-session
