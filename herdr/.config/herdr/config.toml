# Mirrors the Omarchy tmux config in config/tmux/tmux.conf
# tmux session -> herdr workspace, tmux window -> herdr tab, tmux pane -> herdr pane

[theme]
# tmux ran on the terminal's own palette (bg=default, fg=default, ANSI blue accents)
name = "terminal"

[theme.custom]
# The active tab is drawn as panel_bg text on an accent background, so panel_bg
# has to be dark for it to read - same colors as status-left's "#[fg=black,bg=blue]"
panel_bg = "black"
# Keep active sidebar rows distinct without the terminal palette's bright selection fill.
active_row_bg = "#3b3931"

[terminal]
# Matches -c "#{pane_current_path}" on every split, window, and session
new_cwd = "follow"

[keys]
prefix = "ctrl+a"

# Config and help
reload_config = "prefix+r"
help = "prefix+?"
detach = "prefix+d"

# Copy mode, matching tmux's prefix+v entry point. Herdr owns selection behavior.
copy_mode = "prefix+v"

# Panes. Herdr names side-by-side splits "vertical" and stacked splits "horizontal".
split_horizontal = ["prefix+minus", "alt+shift+enter"]
split_vertical = ["prefix+backtick", "alt+enter"]
close_pane = ["prefix+x", "alt+esc"]
zoom = "prefix+z"
last_pane = "prefix+;"

focus_pane_left = ["prefix+h", "ctrl+alt+left"]
focus_pane_down = ["prefix+j", "ctrl+alt+down"]
focus_pane_up = ["prefix+k", "ctrl+alt+up"]
focus_pane_right = ["prefix+l", "ctrl+alt+right"]

resize_mode = ["prefix+ctrl+left", "prefix+ctrl+down", "prefix+ctrl+up", "prefix+ctrl+right"]

# Like tmux's prefix+H/J/K/L, with the existing direct arrow shortcuts retained.
resize_pane_left = ["prefix+shift+h", "ctrl+alt+shift+left"]
resize_pane_down = ["prefix+shift+j", "ctrl+alt+shift+down"]
resize_pane_up = ["prefix+shift+k", "ctrl+alt+shift+up"]
resize_pane_right = ["prefix+shift+l", "ctrl+alt+shift+right"]

# No tmux equivalent; herdr's default prefix+shift+p is taken by previous session
rename_pane = "prefix+shift+o"

# Windows -> tabs
new_tab = "prefix+c"
rename_tab = "prefix+comma"
close_tab = "prefix+ampersand"
switch_tab = ["prefix+1..9", "alt+1..9"]
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]

# Like swap-window -t -1/+1 on M-S-Left/Right
move_tab_previous = "alt+shift+left"
move_tab_next = "alt+shift+right"

# Sessions -> workspaces
new_workspace = "prefix+shift+s"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+d"
previous_workspace = ["prefix+shift+p", "prefix+u", "alt+down"]
next_workspace = ["prefix+shift+n", "prefix+i", "alt+up"]
switch_workspace = "ctrl+1..9"

[ui]
accent = "blue"

# tmux drew single-line dividers between adjacent panes and no outer frame
pane_gaps = false
pane_outer_borders = false

# tmux had no scrollbar column beside its panes
pane_scrollbars = false

# kill-window and kill-session never asked
confirm_close = false

# automatic-rename gave windows a name without prompting
prompt_new_tab_name = false

# set -g mouse on
mouse_capture = true

# Keep Herdr's tabs above the pane area.
tab_bar_position = "top"

# status-right had the zoom flag followed by #h
tab_bar_right = [{ type = "zoom" }, { type = "hostname" }]

# Matches tmux's "tmux: #S:#I.#P #{pane_title}" as closely as Herdr's model allows.
window_title = "herdr: {workspace}:{tab}.{pane} {terminal_title}"
status_indicators = "symbols"
agent_panel_sort = "spaces"
